<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Thought Solver</title>
    <script src="https://js.puter.com/v2/"></script>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; display: flex; justify-content: center; height: 100vh; margin: 0; }
        .container { width: 100%; max-width: 600px; display: flex; flex-direction: column; background: #1e1e1e; }
        #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .bubble { padding: 12px; border-radius: 10px; max-width: 85%; font-size: 15px; line-height: 1.4; }
        .user { align-self: flex-end; background: #007bff; }
        .ai { align-self: flex-start; background: #333; border: 1px solid #444; }
        .input-box { padding: 20px; display: flex; gap: 10px; border-top: 1px solid #333; }
        input { flex: 1; padding: 12px; border-radius: 5px; border: none; background: #2a2a2a; color: white; outline: none; }
        button { background: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; }
        .loading { font-style: italic; color: #888; }
    </style>
</head>
<body>

<div class="container">
    <div id="chat">
        <div class="bubble ai">Helping with your thoughts.</div>
    </div>
    <div class="input-box">
        <input type="text" id="userInput" placeholder="What's the problem?">
        <button onclick="askAI()">Solve</button>
    </div>
</div>

<script>
    async function askAI() {
        const input = document.getElementById('userInput');
        const chat = document.getElementById('chat');
        const text = input.value.trim();
        
        if (!text) return;

        
        appendMsg(text, 'user');
        input.value = '';

        
        const tempId = 'ai-' + Date.now();
        appendMsg("Thinking...", 'ai', tempId);

        try {
            
            const response = await puter.ai.chat(
                `The user is sharing a thought or problem. Provide a clear solution: ${text}`,
                { model: 'gpt-4.1-mini' }
            );
            
            document.getElementById(tempId).innerText = response;
        } catch (error) {
            document.getElementById(tempId).innerText = "Connection error. Try refreshing the page.";
        }
    }

    function appendMsg(text, type, id) {
        const div = document.createElement('div');
        div.className = `bubble ${type}`;
        if(id) div.id = id;
        div.innerText = text;
        const chat = document.getElementById('chat');
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
    }

    
    document.getElementById('userInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') askAI();
    });
</script>

</body>
</html>
