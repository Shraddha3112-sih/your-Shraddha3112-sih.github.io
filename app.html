<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Shopping Cart </title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const App = () => {
            
            const [products] = useState([
                { id: 1, name: "Wireless Headphones", price: 99 },
                { id: 2, name: "Mechanical Keyboard", price: 150 },
                { id: 3, name: "Gaming Mouse", price: 60 }
            ]);

             const [cart, setCart] = useState(() => {
                const savedCart = localStorage.getItem("myCart");
                return savedCart ? JSON.parse(savedCart) : [];
            });

            
            useEffect(() => {
                localStorage.setItem("myCart", JSON.stringify(cart));
            }, [cart]);

            
            const addToCart = (product) => {
                setCart(prev => {
                    const existing = prev.find(item => item.id === product.id);
                    if (existing) {
                        return prev.map(item => 
                            item.id === product.id ? { ...item, qty: item.qty + 1 } : item
                        );
                    }
                    return [...prev, { ...product, qty: 1 }];
                });
            };

            
            const updateQty = (id, delta) => {
                setCart(prev => prev.map(item => {
                    if (item.id === id) {
                        const newQty = item.qty + delta;
                        return { ...item, qty: newQty < 1 ? 1 : newQty };
                    }
                    return item;
                }));
            };

            
            const removeItem = (id) => {
                setCart(prev => prev.filter(item => item.id !== id));
            };

            
            const totalItems = cart.reduce((sum, item) => sum + item.qty, 0);
            const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

            return (
                <div class="max-w-4xl mx-auto">
                    <header class="flex justify-between items-center mb-8 bg-white p-6 rounded-lg shadow-sm">
                        <h1 class="text-2xl font-bold">TechStore</h1>
                        <div class="relative">
                            <span class="text-3xl">🛒</span>
                            {totalItems > 0 && (
                                <span class="absolute -top-2 -right-2 bg-red-500 text-white text-xs rounded-full h-5 w-5 flex items-center justify-center animate-bounce">
                                    {totalItems}
                                </span>
                            )}
                        </div>
                    </header>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                        {/* Product List */}
                        <section>
                            <h2 class="text-xl font-semibold mb-4">Products</h2>
                            {products.map(p => (
                                <div key={p.id} class="bg-white p-4 mb-2 rounded shadow-sm flex justify-between items-center">
                                    <span>{p.name} - ${p.price}</span>
                                    <button 
                                        onClick={() => addToCart(p)}
                                        class="bg-blue-600 text-white px-4 py-1 rounded hover:bg-blue-700">
                                        Add
                                    </button>
                                </div>
                            ))}
                        </section>

                        {/* Shopping Cart */}
                        <section class="bg-white p-6 rounded-lg shadow-md">
                            <h2 class="text-xl font-semibold mb-4 border-b pb-2">Your Cart</h2>
                            {cart.length === 0 ? <p class="text-gray-500 italic">Cart is empty</p> : (
                                <>
                                    {cart.map(item => (
                                        <div key={item.id} class="flex justify-between items-center mb-4 border-b pb-2 last:border-0">
                                            <div>
                                                <p class="font-medium">{item.name}</p>
                                                <p class="text-sm text-gray-600">${item.price} x {item.qty}</p>
                                            </div>
                                            <div class="flex items-center gap-2">
                                                <button onClick={() => updateQty(item.id, -1)} class="bg-gray-200 px-2 rounded">-</button>
                                                <span class="w-4 text-center">{item.qty}</span>
                                                <button onClick={() => updateQty(item.id, 1)} class="bg-gray-200 px-2 rounded">+</button>
                                                <button onClick={() => removeItem(item.id)} class="ml-4 text-red-500 font-bold">✕</button>
                                            </div>
                                        </div>
                                    ))}
                                    <div class="mt-4 pt-4 border-t-2 border-gray-100 flex justify-between items-center font-bold text-lg">
                                        <span>Total:</span>
                                        <span class="text-green-600">${totalPrice}</span>
                                    </div>
                                </>
                            )}
                        </section>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
