<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schema scout</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom CSS for smooth transitions and animations */
        .fade-in { animation: fadeIn 0.5s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-50 font-sans antialiased text-slate-900">
    <div id="root"></div>

    <script type="text/babel">
        const Home = () => (
            <div className="fade-in max-w-4xl mx-auto mt-12 p-8 bg-white rounded-2xl shadow-xl border border-slate-100">
                <div className="text-center">
                    <span className="px-3 py-1 bg-blue-100 text-blue-600 text-sm font-bold rounded-full uppercase tracking-wider">Welcome</span>
                    <h1 className="text-5xl font-extrabold mt-4 text-slate-800 tracking-tight">find your required schemes</h1>
                    <p className="mt-6 text-lg text-slate-600 leading-relaxed">
                        This is a modern landing page experience built for providing information about Government schemes
            
                    </p>
                    <button className="mt-8 px-8 py-3 bg-blue-600 text-white font-semibold rounded-lg hover:bg-blue-700 transition-all shadow-lg shadow-blue-200">
                        Get Started
                    </button>
                </div>
            </div>
        );
           const About = () => (
            <div className="fade-in max-w-4xl mx-auto mt-12 grid grid-cols-1 md:grid-cols-2 gap-8 items-center">
                <div className="p-8 bg-blue-600 rounded-2xl shadow-lg text-white">
                    <h2 className="text-3xl font-bold">Our Mission</h2>
                    <p className="mt-4 opacity-90">To help the society to find the government scheme according to their eligibility.</p>
                </div>
                <div className="p-8 bg-white rounded-2xl shadow-sm border border-slate-200">
                    <h2 className="text-2xl font-bold text-slate-800">Why this?</h2>
                    <p className="mt-3 text-slate-600">It makes thing easier for people to get through their required schemes.</p>
                </div>
            </div>
        );
            const Contact = () => (
            <div className="fade-in max-w-md mx-auto mt-12 p-8 bg-white rounded-2xl shadow-2xl">
                <h2 className="text-3xl font-bold text-slate-800 mb-6">Let's Connect</h2>
                <form className="space-y-4">
                    <div>
                        <label className="block text-sm font-medium text-slate-700 mb-1">Full Name</label>
                        <input type="text" className="w-full p-3 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition-all" placeholder="John Doe" />
                    </div>
                    <div>
                        <label className="block text-sm font-medium text-slate-700 mb-1">Email</label>
                        <input type="email" className="w-full p-3 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition-all" placeholder="john@example.com" />
                    </div>
                    <button className="w-full py-3 bg-slate-900 text-white font-bold rounded-lg hover:bg-black transition-colors">
                        Send Message
                    </button>
                </form>
            </div>
        );
            const App = () => {
            const [currentPage, setCurrentPage] = React.useState('home');

            const navItem = (name, label) => (
                <button 
                    onClick={() => setCurrentPage(name)}
                    className={`px-4 py-2 rounded-md transition-all ${currentPage === name ? 'bg-blue-50 text-blue-600 font-bold' : 'text-slate-500 hover:text-slate-800'}`}
                >
                    {label}
                </button>
            );

            return (
                <div className="min-h-screen pb-20">
                    {/* Navigation Bar */}
                    <nav className="sticky top-0 bg-white/80 backdrop-blur-md border-b border-slate-200 z-50">
                        <div className="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
                            <div className="text-xl font-black text-blue-600 tracking-tighter">SCHEMA.FINDER</div>
                            <div className="flex space-x-2">
                                {navItem('home', 'Home')}
                                {navItem('about', 'About')}
                                {navItem('contact', 'Contact')}
                            </div>
                        </div>
                    </nav>

                    {/* Page Content Switcher */}
                    <main className="px-6">
                        {currentPage === 'home' && <Home />}
                        {currentPage === 'about' && <About />}
                        {currentPage === 'contact' && <Contact />}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
